[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "grove-control-orca-plugin"
dynamic = ["version"]
description = "A Grove Control integration for OrcaSlicer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "hatchling>=1.27", "hatch-vcs>=0.4", "ruff>=0.11"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/grove_control_orca_plugin/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.7"

[tool.hatch.build.hooks.vcs]
version-file = "src/grove_control_orca_plugin/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/grove_control_orca_plugin"]

[tool.hatch.build.targets.sdist]
exclude = ["/venv", "/.venv", "/build", "/dist", "/.ruff_cache"]
