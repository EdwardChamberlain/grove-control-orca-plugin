<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grove Control</title>
  <style>
    body { padding: clamp(16px, 4vw, 40px); }
    main { max-width: 680px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 1.35em; }
    h2 { font-size: 1.1em; margin: 0 0 10px; }
    p { line-height: 1.45; }
    .muted { color: var(--orca-muted); }
    section { margin-top: 18px; padding: 14px; border: 1px solid var(--orca-border); border-radius: 8px; }
    label { display: block; margin: 0 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 8px; }
    textarea { box-sizing: border-box; width: 100%; margin-top: 10px; font: 12px/1.4 monospace; }
    details { margin-top: 18px; }
    summary { cursor: pointer; }
    button { padding: 8px 12px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    #status, #receipt { white-space: pre-wrap; overflow-wrap: anywhere; }
    #status { min-height: 22px; }
    .ready { color: var(--orca-success, #23bd72); font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>Grove Control</h1>
  <p id="plugin-version" class="muted"></p>
  <p class="muted">Connect to Grove, then use <strong>Print plate</strong> with a preset assigned to Grove Queue.</p>

  <section>
    <h2>Connection</h2>
    <form id="connection">
      <label for="grove-url">Grove URL</label>
      <input id="grove-url" type="url" placeholder="https://grove.example.com" required autocomplete="url" disabled>
      <div class="row">
        <button id="save" type="submit" disabled>Save URL</button>
        <button id="sign-in" type="button" disabled>Sign in</button>
        <button id="sign-out" type="button" disabled>Sign out</button>
        <button id="check" type="button" disabled>Check connection</button>
      </div>
    </form>
    <p id="account"></p>
    <p id="availability" class="muted">Loading Grove…</p>
  </section>

  <section>
    <h2>Activity</h2>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="receipt" role="status" aria-live="polite"></p>
  </section>

  <details>
    <summary>Orca connection diagnostics</summary>
    <p class="muted">After a Send timeout, copy this information to report where the connection stopped.</p>
    <textarea id="agent-diagnostics" rows="14" readonly aria-label="Orca connection diagnostics"></textarea>
  </details>
</main>

  <script>
    const url = document.getElementById('grove-url');
    let state = {};
    function send(type, data = {}) { window.orca.postMessage({type, ...data}); }
    function nextStep(data) {
      if (data.unavailable) return 'Grove setup is unavailable.';
      if (data.busy) return 'Grove is working…';
      if (!data.grove_url) return 'Enter and save your Grove server URL.';
      if (!data.account) return 'Sign in with your Grove account.';
      if (!data.connection_verified) return 'Use Check connection to reconnect to Grove.';
      if (!data.orca_connected) return 'Select a Grove Queue preset and choose Grove Queue in Orca’s Device tab.';
      return 'Ready for Print plate.';
    }
    function render(data) {
      state = data;
      document.getElementById('plugin-version').textContent = `Plugin ${data.plugin_version || 'unknown'}`;
      const diagnostics = document.getElementById('agent-diagnostics');
      if (document.activeElement !== diagnostics) {
        diagnostics.value = JSON.stringify(data.agent_diagnostics || {
          plugin_version: data.plugin_version,
          message: 'The Grove Queue agent has not been initialized.'
        }, null, 2);
      }
      if (document.activeElement !== url) url.value = data.grove_url || '';
      const blocked = !!data.busy || !!data.unavailable;
      url.disabled = blocked;
      document.getElementById('save').disabled = blocked;
      document.getElementById('sign-in').disabled = blocked || !data.grove_url || !!data.account;
      document.getElementById('sign-out').disabled = blocked || !data.account;
      document.getElementById('check').disabled = blocked || !data.account;
      document.getElementById('account').textContent = data.account
        ? `Signed in as ${data.account.username}` : 'Not signed in';
      const availability = document.getElementById('availability');
      availability.textContent = nextStep(data);
      availability.className = data.ready_for_print && data.orca_connected ? 'ready' : 'muted';
      document.getElementById('status').textContent = data.message || '';
      const result = data.last_submission;
      document.getElementById('receipt').textContent = result
        ? [result.message, result.library_file_id ? `Grove file #${result.library_file_id}` : '',
           result.queue_item_ids.length ? `Queue items: ${result.queue_item_ids.join(', ')}` : '']
            .filter(Boolean).join('\n')
        : '';
    }
    document.getElementById('connection').onsubmit = event => {
      event.preventDefault();
      send('configure', {grove_url: url.value});
    };
    document.getElementById('sign-in').onclick = () => {
      if (url.value.trim().replace(/\/+$/, '') !== state.grove_url) {
        document.getElementById('status').textContent = 'Save the Grove URL before signing in.';
        return;
      }
      send('sign_in');
    };
    document.getElementById('sign-out').onclick = () => send('sign_out');
    document.getElementById('check').onclick = () => send('check_connection');
    window.orca.onMessage(data => {
      if (data.type === 'state') render(data);
      if (data.type === 'notice') document.getElementById('status').textContent = data.message;
    });
    send('ready');
    function refreshIfVisible() {
      if (!document.hidden) send('refresh');
    }
    document.addEventListener('visibilitychange', refreshIfVisible);
    window.setInterval(refreshIfVisible, 2000);
  </script>
</body>
</html>
